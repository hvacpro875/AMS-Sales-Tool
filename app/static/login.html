<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Sign in | Best in Class</title><style>body{font:16px system-ui;background:#eef3f8;display:grid;place-items:center;min-height:90vh;color:#17334e}form{background:white;border-radius:16px;padding:30px;width:min(92vw,400px);box-shadow:0 8px 30px #17334e22}input,button{box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border-radius:8px;border:1px solid #9fb4c8;font-size:16px}button{background:#075a9c;color:white;border:0;cursor:pointer}#error{color:#b42318}</style></head><body><form id="form"><h1>Best in Class</h1><p>Private Home Comfort Proposal Studio</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="error" role="alert"></p></form><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!r.ok)throw Error('Sign in failed. Check your credentials.');location.href='/'}catch(x){error.textContent=x.message}}</script></body></html>
